# One-command deployment: docker compose up -d --build
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: smart_civic
      MYSQL_USER: civic
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      args: { WITH_AI: "${WITH_AI:-false}" }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://civic:${DB_PASSWORD}@db:3306/smart_civic
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@civic.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      AI_ENABLED: ${AI_ENABLED:-auto}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: [uploads:/app/uploads, model_cache:/app/.cache]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${WEB_PORT:-8080}:80"]

volumes:
  db_data:
  uploads:
  model_cache:
